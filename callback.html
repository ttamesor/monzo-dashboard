<!DOCTYPE html>
<html>
<head>
  <title>Connecting...</title>
</head>
<body>
  <p>Connecting to Monzo...</p>

<script>
(function(){
  function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  var code = getParam('code');
  var state = getParam('state');
  var gas = localStorage.getItem('monzo_gas_url');

  if(!code || !state || !gas){
    document.body.innerHTML = 'Missing OAuth parameters';
    return;
  }

  fetch(gas + '?action=exchange&code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state))
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res.status !== 'ok'){
        document.body.innerHTML = 'Token exchange failed';
        return;
      }

      // Save state so dashboard can use it
      localStorage.setItem('monzo_state', state);

      // Redirect back to main dashboard
      window.location.href = 'index.html';
    })
    .catch(function(){
      document.body.innerHTML = 'Error connecting to backend';
    });
})();
</script>
</body>
</html>
