<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monzo Dashboard - Connecting...</title>
<style>
  body{font-family:"DM Sans",sans-serif;background:#0D1B2A;color:#F0F4FF;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .box{background:#1C2D42;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:2.5rem;max-width:420px;width:100%;text-align:center;}
  .logo{width:44px;height:44px;background:#FF5A5F;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:white;margin:0 auto 1.5rem;}
  h2{font-size:18px;font-weight:500;margin-bottom:0.5rem;}
  p{font-size:14px;color:#8BA0B4;line-height:1.6;margin-bottom:0;}
  .spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,0.1);border-top-color:#FF5A5F;border-radius:50%;animation:spin 0.7s linear infinite;margin:1.5rem auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{color:#FF8A8E;font-size:14px;margin-top:1rem;}
  .btn{display:block;width:100%;border:none;border-radius:8px;padding:13px;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;margin-top:1rem;transition:opacity 0.2s;}
  .btn:hover{opacity:0.88;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-coral{background:#FF5A5F;color:white;}
  .btn-grey{background:#162236;border:1px solid rgba(255,255,255,0.1);color:#F0F4FF;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">M</div>
  <h2 id="title">One moment...</h2>
  <p id="msg"></p>
  <div class="spinner" id="spinner" style="display:none;"></div>
  <button class="btn btn-coral" id="btn-send" style="display:none;">Send approval request to Monzo app</button>
  <button class="btn btn-grey" id="btn-done" style="display:none;">I have approved - connect me</button>
  <div class="err" id="err" style="display:none;"></div>
</div>
<script>
window.addEventListener('DOMContentLoaded', function(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  var error = params.get('error');

  var gasUrl = localStorage.getItem('monzo_gas_url');
  var savedState = localStorage.getItem('monzo_oauth_state');
  var redirectUri = 'https://ttamesor.github.io/monzo-dashboard/callback.html';

  function setTitle(t){ document.getElementById('title').textContent = t; }
  function setMsg(m){ document.getElementById('msg').textContent = m; }
  function showSpinner(v){ document.getElementById('spinner').style.display = v ? 'block' : 'none'; }
  function showBtn(id, v){ document.getElementById(id).style.display = v ? 'block' : 'none'; }
  function showErr(msg){
    showSpinner(false); showBtn('btn-send',false); showBtn('btn-done',false);
    setTitle('Connection failed');
    var el = document.getElementById('err');
    el.style.display = 'block'; el.textContent = msg;
  }

  if(error){ showErr('Monzo returned: ' + error); return; }
  if(!code){ showErr('No authorisation code in URL.'); return; }
  if(!gasUrl){ showErr('GAS relay URL not found. Return to dashboard and try again.'); return; }
  if(state && savedState && state !== savedState){ showErr('Security check failed. Please try again.'); return; }

  // Ready - show step 1
  setTitle('Almost there');
  setMsg('Click the button below to send an approval request to your Monzo app.');
  showBtn('btn-send', true);

  var exchangeResult = null;

  // Step 1: just show instructions - do NOT exchange yet
  document.getElementById('btn-send').addEventListener('click', function(){
    var btn = document.getElementById('btn-send');
    btn.disabled = true;
    btn.textContent = 'Waiting for app approval...';
    setTitle('Approve in the Monzo app');
    setMsg('Open your Monzo app and approve the login request. Once approved, click the button below.');
    showBtn('btn-done', true);
  });

  // Step 2: user has approved - NOW exchange the code
  document.getElementById('btn-done').addEventListener('click', function(){
    showBtn('btn-send', false);
    showBtn('btn-done', false);
    showSpinner(true);
    setTitle('Connecting...');
    setMsg('Exchanging authorisation code.');

    fetch(gasUrl + '?action=exchange&code=' + encodeURIComponent(code) + '&redirect_uri=' + encodeURIComponent(redirectUri))
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res || res.status !== 'ok'){
          showErr('Failed: ' + ((res && res.message) || 'Unknown error')); return;
        }
        if(res.data && res.data.account_id){
          localStorage.setItem('monzo_dash_v3', JSON.stringify({
            gasUrl: gasUrl,
            accountId: res.data.account_id
          }));
        }
        setTitle('Connected!');
        setMsg('Redirecting...');
        showSpinner(false);
        setTimeout(function(){
          window.location.href = 'https://ttamesor.github.io/monzo-dashboard/';
        }, 1000);
      })
      .catch(function(e){ showErr('Connection error: ' + e.message); });
  });
});
</script>
</body>
</html>
