<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const state = params.get('state');

const gasUrl = 'YOUR_GAS_URL';

if (!code || !state) {
  document.body.innerText = 'Missing code/state';
} else {
  fetch(`${gasUrl}?action=exchange&code=${code}&state=${state}`)
    .then(r => r.json())
    .then(res => {
      if (res.status !== 'ok') {
        document.body.innerText = 'Auth failed';
        return;
      }

      localStorage.setItem('monzo_state', state);

      window.location.href = '/monzo-dashboard/';
    });
}
</script>
